<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle - Magnetic Assemble</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        
        /* --- Back to Portal Button Styles --- */
        .top-right-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        .back-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 13px;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateX(-5px);
        }

        /* --- UI Layer Styles --- */
        #instructions {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            text-align: center;
            pointer-events: none;
            font-size: 11px;
            letter-spacing: 2px;
            z-index: 10;
        }
        #ui-layer {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .library-group {
            display: flex;
            gap: 8px;
        }
        input[type="file"] { display: none; }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255,255,255,0.5); }
        .preset-btn { background: rgba(100, 100, 255, 0.2); }

        /* --- Scan Upload Modal / Mobile Sender Page (added) --- */
        .modal-overlay{
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .qr-card{
            background: rgba(255,255,255,0.95);
            color: #111;
            border-radius: 18px;
            padding: 22px 20px;
            width: min(360px, 100%);
            text-align: center;
            box-shadow: 0 18px 60px rgba(0,0,0,0.55);
            position: relative;
        }
        .qr-close-x{
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.65);
            cursor: pointer;
            font-size: 18px;
            line-height: 30px;
            padding: 0;
        }
        .qr-close-x:hover{ background: rgba(0,0,0,0.08); color: rgba(0,0,0,0.85); }
        .qr-title{ font-size: 14px; letter-spacing: 1px; margin: 0 0 8px 0; }
        .qr-sub{ font-size: 12px; color: rgba(0,0,0,0.6); line-height: 1.5; margin-bottom: 12px; }
        .qr-warning{
            display: none;
            margin-top: 10px;
            font-size: 12px;
            color: #b42318;
            background: #fee4e2;
            padding: 8px 10px;
            border-radius: 10px;
        }
        #uploadStatus{ font-size: 12px; color: rgba(0,0,0,0.7); min-height: 16px; }
        #mobileUploadPage{
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at top, rgba(100, 100, 255, 0.15), rgba(0,0,0,1) 60%);
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            color: #fff;
            text-align: center;
        }
        #mobileUploadCard{
            width: min(420px, 100%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(14px);
        }
        #mobileUploadCard h2{ margin: 0 0 10px 0; font-size: 16px; letter-spacing: 1px; }
        #mobileUploadHint{ font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.55; margin-bottom: 14px; }
        #mobileUploadStatus{ font-size: 12px; margin-top: 12px; color: rgba(255,255,255,0.85); }
        #mobileImageUpload{ display: none; }

        /* Push the lil-gui down so it doesn't cover the back button */
        .lil-gui.root { margin-top: 130px !important; }
    </style>
</head>
<body>

    <div class="top-right-container">
        <nav class="back-nav">
            <a href="index.html" class="back-button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>返回首页</span>
            </a>
        </nav>
        <button class="btn" id="qrUploadBtn" onclick="showUploadQRModal()">扫码上传图片</button>
    </div>

    <!-- Scan Upload Modal (added) -->
    <div class="modal-overlay" id="qrUploadModal" onclick="closeUploadModal()">
        <div class="qr-card" onclick="event.stopPropagation()">
            <button class="qr-close-x" onclick="closeUploadModal()" aria-label="关闭">×</button>
            <h3 class="qr-title">扫码上传图片</h3>
            <div class="qr-sub">用手机扫码打开后，从手机本地选择图片上传到当前页面。</div>
            <div id="qrcodeUpload" style="margin: 10px auto 10px auto; display:flex; justify-content:center;"></div>
            <div id="uploadStatus">等待手机上传…</div>
            <div id="uploadWarning" class="qr-warning">⚠️ 需联网才可使用扫码上传（通过公共消息中转服务传输图片）。</div>
            <button class="btn" style="margin-top: 14px;" onclick="closeUploadModal()">关闭</button>
        </div>
    </div>

    <!-- Mobile Sender Page (added) -->
    <div id="mobileUploadPage">
        <div id="mobileUploadCard">
            <h2>上传图片到大屏</h2>
            <div id="mobileUploadHint">点击下方按钮选择一张手机本地图片，上传完成后大屏会自动更新 3D 粒子模型。</div>
            <button class="btn" style="width: 100%;" onclick="document.getElementById('mobileImageUpload').click()">选择图片并上传</button>
            <input type="file" id="mobileImageUpload" accept="image/*">
            <div id="mobileUploadStatus">等待选择图片…</div>
        </div>
    </div>

    <div id="instructions">HOLD MOUSE TO ASSEMBLE • RELEASE TO SCATTER<br>长按鼠标聚拢 • 松开恢复</div>
    
    <div id="ui-layer">
        <div class="library-group" id="presetLibrary">
            <div class="btn preset-btn" data-url="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format">PRESET 1</div>
            <div class="btn preset-btn" data-url="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=500&auto=format">PRESET 2</div>
            <div class="btn preset-btn" data-url="https://images.unsplash.com/photo-1557683316-973673baf926?w=500&auto=format">PRESET 3</div>
        </div>
        <label class="btn">
            UPLOAD YOUR OWN
            <input type="file" id="imageLoader" accept="image/*">
        </label>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';

        // ==============================
        // 扫码上传图片（added；复用现有 createSystem/img 逻辑，不改动模型生成方式）
        // ==============================
        const MQTT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        const MQTT_TOPIC_PREFIX = 'solo-holo-upload/v1/';
        // base64 分片大小：过大更易在移动网络下丢包/阻塞，导致接收端卡在 79% 等进度
        const UPLOAD_CHUNK_SIZE = 18000;
        let uploadReceiver = null;

        function genSessionId() {
            const bytes = new Uint8Array(12);
            crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function buildUploadUrl(sessionId) {
            const url = new URL(window.location.href);
            url.searchParams.set('uploadSession', sessionId);
            url.searchParams.set('role', 'sender');
            return url.toString();
        }

        function setUploadStatus(text) {
            const el = document.getElementById('uploadStatus');
            if (el) el.innerText = text;
        }

        window.closeUploadModal = function() {
            document.getElementById('qrUploadModal').style.display = 'none';
            // 关闭弹窗时停止接收会话，避免后台占用连接与误收消息
            if (uploadReceiver && uploadReceiver.client) {
                try { uploadReceiver.client.end(true); } catch (e) {}
            }
            uploadReceiver = null;
        };

        window.showUploadQRModal = function() {
            const modal = document.getElementById('qrUploadModal');
            const q = document.getElementById('qrcodeUpload');
            q.innerHTML = '';
            setUploadStatus('等待手机上传…');
            document.getElementById('uploadWarning').style.display = 'none';

            const sessionId = genSessionId();
            const url = buildUploadUrl(sessionId);
            new QRCode(q, { text: url, width: 180, height: 180, colorDark: "#000", colorLight: "#fff" });
            modal.style.display = 'flex';

            startUploadReceiver(sessionId).catch((err) => {
                console.error(err);
                setUploadStatus('启动接收失败，请检查网络。');
                document.getElementById('uploadWarning').style.display = 'block';
            });
        };

        async function connectMqttClient(clientId) {
            if (!window.mqtt || !window.mqtt.connect) throw new Error('mqtt 库未加载');
            const client = window.mqtt.connect(MQTT_BROKER_URL, {
                clientId,
                clean: true,
                reconnectPeriod: 1500,
                connectTimeout: 8000
            });
            await new Promise((resolve, reject) => {
                const onConnect = () => { cleanup(); resolve(); };
                const onError = (e) => { cleanup(); reject(e); };
                const cleanup = () => {
                    client.off('connect', onConnect);
                    client.off('error', onError);
                };
                client.on('connect', onConnect);
                client.on('error', onError);
            });
            return client;
        }

        async function mqttPublish(client, topic, payload) {
            return new Promise((resolve, reject) => {
                // QoS 1 提升可靠性，避免分片丢失导致进度卡住
                client.publish(topic, payload, { qos: 1 }, (err) => err ? reject(err) : resolve());
            });
        }

        async function startUploadReceiver(sessionId) {
            if (uploadReceiver && uploadReceiver.client) {
                try { uploadReceiver.client.end(true); } catch (e) {}
            }

            setUploadStatus('正在建立连接…');
            const topic = MQTT_TOPIC_PREFIX + sessionId;
            const client = await connectMqttClient('mouse-receiver-' + genSessionId());

            uploadReceiver = { sessionId, topic, client, meta: null, chunks: null, received: 0, lastMessageAt: 0 };
            client.subscribe(topic, { qos: 1 });

            client.on('message', async (_topic, message) => {
                if (_topic !== topic) return;
                let data;
                try { data = JSON.parse(message.toString()); } catch (e) { return; }
                if (!data || !data.t) return;

                if (data.t === 'meta') {
                    uploadReceiver.lastMessageAt = Date.now();
                    uploadReceiver.meta = data;
                    uploadReceiver.chunks = new Array(data.totalChunks || 0);
                    uploadReceiver.received = 0;
                    setUploadStatus(`已连接，开始接收：${data.name || '图片'}…`);

                    // 超时保护：长时间未收齐分片则提示重试，避免一直卡在某个百分比
                    const timeoutMs = 20000;
                    const mySessionId = uploadReceiver.sessionId;
                    setTimeout(() => {
                        if (!uploadReceiver || uploadReceiver.sessionId !== mySessionId) return;
                        if (!uploadReceiver.chunks || uploadReceiver.received === uploadReceiver.chunks.length) return;
                        const idle = Date.now() - (uploadReceiver.lastMessageAt || 0);
                        if (idle >= timeoutMs) {
                            setUploadStatus('接收超时，请在手机端重新上传。');
                            uploadReceiver.meta = null;
                            uploadReceiver.chunks = null;
                            uploadReceiver.received = 0;
                        }
                    }, timeoutMs + 200);
                    return;
                }

                if (data.t === 'chunk' && uploadReceiver.chunks) {
                    uploadReceiver.lastMessageAt = Date.now();
                    const idx = data.idx;
                    if (typeof idx !== 'number') return;
                    if (!uploadReceiver.chunks[idx]) {
                        uploadReceiver.chunks[idx] = data.data || '';
                        uploadReceiver.received += 1;
                        const total = uploadReceiver.chunks.length || 1;
                        const pct = Math.floor((uploadReceiver.received / total) * 100);
                        setUploadStatus(`接收中… ${pct}%`);
                    }

                    if (uploadReceiver.received === uploadReceiver.chunks.length) {
                        const dataUrl = uploadReceiver.chunks.join('');
                        setUploadStatus('接收完成，正在生成 3D 粒子模型…');
                        await handleIncomingImageDataUrl(dataUrl);
                        // 不在此处断开连接：允许同一次扫码会话连续上传多张图片
                        setUploadStatus('完成 ✅（可继续上传）');
                        uploadReceiver.meta = null;
                        uploadReceiver.chunks = null;
                        uploadReceiver.received = 0;
                    }
                }
            });

            setUploadStatus('等待手机上传…');
        }

        async function handleIncomingImageDataUrl(dataUrl) {
            const img = new Image();
            await new Promise((resolve) => {
                img.onload = () => resolve();
                img.src = dataUrl;
            });
            createSystem(img);
        }

        function renderMobileSenderUI(sessionId) {
            // 仅在手机端上传页面：隐藏原 UI
            const top = document.querySelector('.top-right-container');
            if (top) top.style.display = 'none';
            const inst = document.getElementById('instructions');
            if (inst) inst.style.display = 'none';
            const ui = document.getElementById('ui-layer');
            if (ui) ui.style.display = 'none';

            const page = document.getElementById('mobileUploadPage');
            page.style.display = 'flex';

            const status = document.getElementById('mobileUploadStatus');
            const input = document.getElementById('mobileImageUpload');

            input.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                status.innerText = '读取图片…';
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                status.innerText = '连接中…';
                const topic = MQTT_TOPIC_PREFIX + sessionId;
                let client;
                try {
                    client = await connectMqttClient('mouse-sender-' + genSessionId());
                } catch (err) {
                    console.error(err);
                    status.innerText = '连接失败，请检查网络后重试。';
                    return;
                }

                try {
                    const totalChunks = Math.ceil(dataUrl.length / UPLOAD_CHUNK_SIZE);
                    await mqttPublish(client, topic, JSON.stringify({
                        t: 'meta',
                        name: file.name,
                        size: file.size,
                        mime: file.type,
                        totalChunks
                    }));

                    status.innerText = '上传中… 0%';
                    for (let i = 0; i < totalChunks; i++) {
                        const chunk = dataUrl.slice(i * UPLOAD_CHUNK_SIZE, (i + 1) * UPLOAD_CHUNK_SIZE);
                        await mqttPublish(client, topic, JSON.stringify({ t: 'chunk', idx: i, data: chunk }));
                        const pct = Math.floor(((i + 1) / totalChunks) * 100);
                        status.innerText = `上传中… ${pct}%`;
                        await new Promise(r => setTimeout(r, 5));
                    }

                    status.innerText = '上传完成 ✅ 你可以返回大屏查看效果。';
                    try {
                        // QoS1 下 publish 回调已拿到 PUBACK；弱网下给一点缓冲，避免最后分片未送达
                        await new Promise(r => setTimeout(r, 200));
                        client.end(false);
                    } catch (e) {}
                } catch (err) {
                    console.error(err);
                    status.innerText = '上传失败，请重试。';
                    try { client.end(false); } catch (e) {}
                } finally {
                    // 允许用户连续选择同一文件也能触发再次上传
                    input.value = '';
                }
            });
        }

        const state = {
            particleSize: 0.025,
            systemScale: 0.035,
            scatterRange: 12,
            rotationSpeed: 0.005,
            autoRotate: false,
            panelWidth: 180,
            tint: '#ffffff'
        };

        let scene, camera, renderer, particles, geometry, material, gui;
        let isPressed = false;

        // 若扫码链接带 role=sender，则显示手机端上传页；否则按原逻辑初始化
        (() => {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('uploadSession');
            const role = params.get('role');
            if (sessionId && role === 'sender') renderMobileSenderUI(sessionId);
            else init();
        })();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            gui = new GUI({ title: 'Controls' });
            gui.width = state.panelWidth;
            gui.addColor(state, 'tint').name('Color Tint').onChange(v => material.color.set(v));
            gui.add(state, 'particleSize', 0.005, 0.1).name('Size');
            gui.add(state, 'scatterRange', 2, 30).name('Scatter');
            gui.add(state, 'autoRotate').name('Auto Spin');

            window.addEventListener('mousedown', () => isPressed = true);
            window.addEventListener('mouseup', () => isPressed = false);
            window.addEventListener('touchstart', (e) => { isPressed = true; }, {passive: true});
            window.addEventListener('touchend', () => isPressed = false);

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    loadFromURL(e.target.dataset.url);
                });
            });

            document.getElementById('imageLoader').addEventListener('change', handleUpload);
            window.addEventListener('resize', onResize);

            loadFromURL(document.querySelector('.preset-btn').dataset.url);

            animate();
        }

        function loadFromURL(url) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => createSystem(img);
            img.src = url;
        }

        function handleUpload(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => createSystem(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function createSystem(img) {
            if (particles) { 
                scene.remove(particles); 
                geometry.dispose(); 
                material.dispose(); 
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const res = 120; 
            canvas.width = res;
            canvas.height = res * (img.height / img.width);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const positions = [];
            const colors = [];
            const homes = [];
            const scats = [];

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i + 3] > 128) {
                        const hx = (x - canvas.width / 2) * state.systemScale;
                        const hy = -(y - canvas.height / 2) * state.systemScale;
                        const hz = (Math.random() - 0.5) * 0.5;
                        homes.push(hx, hy, hz);

                        const sx = (Math.random() - 0.5) * state.scatterRange;
                        const sy = (Math.random() - 0.5) * state.scatterRange;
                        const sz = (Math.random() - 0.5) * state.scatterRange;
                        scats.push(sx, sy, sz);

                        positions.push(sx, sy, sz);
                        colors.push(data[i]/255, data[i+1]/255, data[i+2]/255);
                    }
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('home', new THREE.Float32BufferAttribute(homes, 3));
            geometry.setAttribute('scat', new THREE.Float32BufferAttribute(scats, 3));

            material = new THREE.PointsMaterial({
                size: state.particleSize,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (particles) {
                if (state.autoRotate) particles.rotation.y += state.rotationSpeed;
                material.size = state.particleSize;

                const posAttr = geometry.attributes.position;
                const homeAttr = geometry.attributes.home;
                const scatAttr = geometry.attributes.scat;

                const lerpSpeed = isPressed ? 0.12 : 0.05; 

                for (let i = 0; i < posAttr.count; i++) {
                    const curX = posAttr.getX(i);
                    const curY = posAttr.getY(i);
                    const curZ = posAttr.getZ(i);

                    const targetX = isPressed ? homeAttr.getX(i) : scatAttr.getX(i);
                    const targetY = isPressed ? homeAttr.getY(i) : scatAttr.getY(i);
                    const targetZ = isPressed ? homeAttr.getZ(i) : scatAttr.getZ(i);

                    posAttr.setXYZ(i, 
                        curX + (targetX - curX) * lerpSpeed,
                        curY + (targetY - curY) * lerpSpeed,
                        curZ + (targetZ - curZ) * lerpSpeed
                    );
                }
                posAttr.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
